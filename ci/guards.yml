# Sutradhar CI template - wire the guards into GitHub Actions.
# Copy into .github/workflows/, adjust paths, delete this banner.
#
# Principles encoded here:
#   - lints run the guard's SELFCHECK first (a blind detector must fail CI,
#     not pass it vacuously)
#   - every step's exit code is the step's verdict; nothing pipes a test
#     through anything that swallows $?
#   - the e2e tier is real: it boots the stack and runs the behavioral
#     suite, not a smoke ping

name: guards

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-guards:
    name: Python guards (lint ratchets + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Each lint runs its selfcheck internally before scanning; a detector
      # that cannot flag its planted bad case exits nonzero here.
      - name: Silent-swallow ratchet
        run: python scripts/swallow_lint.py src/ --baseline scripts/swallow_baseline.json

      - name: Query-interpolation guard
        run: python scripts/interpolation_lint.py src/ --keywords sql

      # Doctrine 1.1: every number declared in a design note must have a
      # test behind it. A budget nobody enforces reads as a commitment
      # and behaves like a wish.
      - name: Declared budgets are enforced
        run: python scripts/budget.py docs/design/ --tests tests/

      # The round records feed doctrine 8.1 and 8.3. Validate them; a
      # mistyped rule id loses an attribution nobody will miss.
      - name: Round records are valid
        run: python scripts/rounds.py docs/rounds/ --check

      # The verifier must be able to catch a decorative guard, or it is one.
      - name: verify-guard selfcheck
        run: python scripts/verify_guard.py --selfcheck

      # The gate that makes every other number here trustworthy must itself
      # be shown to work (doctrine 6.6, and 2.2 applied to it).
      - name: obsgate selfcheck
        run: python scripts/obsgate.py --selfcheck

      # Doctrine 6.6: the observability floor as a provenance gate. Point
      # this at a staging or preview endpoint and it answers whether the
      # surfaces any later claim will lean on are actually live. Uncomment
      # once you have an endpoint and a floor manifest; leaving it
      # commented is honest, faking a green one is not.
      #
      # Exit 0 WITNESSED / 1 UNWITNESSED / 3 INCONCLUSIVE - and 3 is not a
      # pass, so do NOT add `|| true` here. An endpoint you could not read
      # tells you nothing, and a step that swallows that is the empty-200
      # lie one layer up.
      #
      # - name: Observability floor is witnessed
      #   run: |
      #     python scripts/obsgate.py \
      #       --metrics "${{ secrets.STAGING_METRICS_URL }}" \
      #       --floor obs_floor.json

      # Doctrine 2.2, enforced per PR rather than per honour system: for a
      # commit that claims to fix something, revert its production half and
      # require the named guard to go red. Set GUARD_CMD in the PR body, a
      # commit trailer, or a label - whatever your team already uses; the
      # step below reads a `Guard-cmd:` trailer and skips when absent.
      #
      # `|| exit $?` is deliberate: exit 1 (DECORATION) and exit 2
      # (INCONCLUSIVE) are both failures, and neither may be swallowed.
      - name: Guards shipped in this PR are real
        run: |
          set -euo pipefail
          GUARD_CMD="$(git log -1 --format=%B | sed -n 's/^Guard-cmd: //p')"
          if [ -z "$GUARD_CMD" ]; then
            echo "no Guard-cmd trailer on HEAD; skipping (see docs/backend.md)"
            exit 0
          fi
          python scripts/verify_guard.py --guard-cmd "$GUARD_CMD"

      - name: Unit tests (including the ratchet tests)
        run: |
          pip install pytest
          python -m pytest -q tests/

  frontend-guards:
    name: Frontend guards (types + behavioral suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # The behavioral suite needs the app running. Adjust to your stack;
      # the pattern that matters: wait for real health with a bounded loop,
      # fail loudly on timeout, and let cypress's exit code be the verdict.
      - name: Boot app
        run: |
          npm run build
          npm run preview -- --port 4173 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4173 >/dev/null 2>&1; then
              echo "app ready after $((i))s"; exit 0
            fi
            sleep 1
          done
          echo "::error::app never became ready in 60s"; exit 1

      - name: Route sweep + behavioral specs
        run: npx cypress run --browser chrome

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
