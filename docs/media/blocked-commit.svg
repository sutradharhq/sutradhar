<svg xmlns="http://www.w3.org/2000/svg" width="880" height="498" viewBox="0 0 880 498" role="img" aria-label="A pre-commit hook denying a commit and naming the offending line">
<rect width="880" height="498" rx="10" fill="#0d1117"/>
<rect width="880" height="36" rx="10" fill="#161b22"/>
<rect y="26" width="880" height="10" fill="#161b22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/>
<circle cx="40" cy="18" r="6" fill="#febc2e"/>
<circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="440.0" y="23" fill="#8b949e" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">sutradhar &#8212; the commit that did not happen</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
<text x="26" y="52" fill="#8b949e" xml:space="preserve">varun@mac ~/orders $ claude</text>
<text x="26" y="92" fill="#c9d1d9" xml:space="preserve">&gt; add a helper that looks up orders for a customer</text>
<text x="26" y="132" fill="#c9d1d9" xml:space="preserve">⏺ Bash(git commit -m &quot;add order lookup&quot;)</text>
<text x="26" y="152" fill="#f85149" font-weight="600" xml:space="preserve">  └─ permission denied by sutradhar</text>
<text x="26" y="192" fill="#f85149" font-weight="600" xml:space="preserve">[sutradhar-hooks] pre-commit gate: BLOCKED by interpolation_lint.</text>
<text x="26" y="232" fill="#8b949e" xml:space="preserve">--- interpolation_lint (exit 1) ---</text>
<text x="26" y="252" fill="#c9d1d9" xml:space="preserve">[interpolation-lint] 1 query interpolation risk(s) - wrap with an</text>
<text x="26" y="272" fill="#c9d1d9" xml:space="preserve">escaping call at the site:</text>
<text x="26" y="312" fill="#d29922" font-weight="600" xml:space="preserve">    python/orders.py:2   {customer}</text>
<text x="26" y="352" fill="#c9d1d9" xml:space="preserve">Guards: interpolation_lint RED | framework_shape OK | rounds OK</text>
<text x="26" y="372" fill="#8b949e" xml:space="preserve">        swallow_lint skipped (no swallow_baseline.json - the</text>
<text x="26" y="392" fill="#8b949e" xml:space="preserve">        ratchet has no floor to hold)</text>
<text x="26" y="412" fill="#8b949e" xml:space="preserve">Measured the working tree, not the index.</text>
<text x="26" y="452" fill="#3fb950" xml:space="preserve">&gt; the commit never happened. the guard named the line.</text>
</g></svg>